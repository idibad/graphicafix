<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#024442">
  <title>Offline | Graphicafix</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 410px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-top: 4px solid #b8f35a;
      border-radius: 18px;
      padding: 32px 26px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(15, 23, 42, 0.06);
    }
    .icon {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      margin: 0 auto 18px;
      display: block;
      box-shadow: 0 6px 18px rgba(2, 68, 66, 0.14);
    }
    .badge {
      display: inline-block;
      background: #ecfccb;
      color: #365314;
      border: 1px solid #d9f99d;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      padding: 4px 11px;
      border-radius: 999px;
      margin-bottom: 12px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.3rem;
      font-weight: 800;
      color: #0f172a;
    }
    p {
      margin: 0 0 22px;
      font-size: 0.9rem;
      line-height: 1.55;
      color: #64748b;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn-primary {
      width: 100%;
      padding: 12px 18px;
      border-radius: 11px;
      border: 1px solid #a3e635;
      background: #b8f35a;
      color: #142600;
      font-size: 0.92rem;
      font-weight: 800;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }
    .btn-secondary {
      width: 100%;
      padding: 11px 18px;
      border-radius: 11px;
      border: 1px solid #e2e8f0;
      background: #f8fafc;
      color: #334155;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }
    .btn-primary:active, .btn-secondary:active { transform: scale(0.98); }
  </style>
</head>
